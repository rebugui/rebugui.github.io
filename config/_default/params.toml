mainSections   = ["post"]
rssFullContent = true
favicon        = "/img/avatar.png"

[footer]
    since = 2025

[sidebar]
    emoji    = "🐢"
    subtitle = "Clean, responsive Hugo theme"
    avatar   = "img/avatar.png"

[article]
    [article.license]
        enabled = false

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[comments]
    enabled = false

[colorScheme]
    toggle = true
    default = "auto"

[related]
    includeNewer = true
    threshold = 60
    toLower = false
    [[related.indices]]
        name = "tags"
        weight = 100
    [[related.indices]]
        name = "categories"
        weight = 200

[tableOfContents]
    endLevel = 4
    ordered = true
    startLevel = 2

[highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = true
    tabWidth = 4
